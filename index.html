<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task Scheduler</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-yantra">
    <div class="container">
        <h1>Daily Task Scheduler</h1>

        <!-- Theme Switcher -->
        <div class="theme-switcher">
            <span>Theme:</span>
            <button class="theme-btn theme-yantra active" data-theme="theme-yantra" title="Yantra"></button>
            <button class="theme-btn theme-sage" data-theme="theme-sage" title="Sage"></button>
            <button class="theme-btn theme-obsidian" data-theme="theme-obsidian" title="Obsidian"></button>
        </div>

        <!-- Task input form -->
        <div class="task-form">
            <input type="text" id="taskInput" placeholder="Enter a new task...">
            
            <div class="task-details">
                <!-- Due date input -->
                <div class="form-group">
                    <label for="dueDate">Due Date:</label>
                    <input type="date" id="dueDate">
                </div>
                
                <!-- Category selection -->
                <div class="form-group">
                    <label for="category">Category:</label>
                    <select id="category">
                        <option value="personal">Personal</option>
                        <option value="work">Work</option>
                        <option value="shopping">Shopping</option>
                        <option value="health">Health</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- Priority selection -->
                <div class="form-group">
                    <label for="priority">Priority:</label>
                    <select id="priority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
            </div>
            
            <button id="addTask">Add Task</button>
        </div>

        <!-- View Toggle -->
        <div class="view-toggle">
            <button class="view-btn active" data-view="list"><i class="fas fa-list"></i> List</button>
            <button class="view-btn" data-view="board"><i class="fas fa-columns"></i> Board</button>
        </div>

        <!-- Task filter options (List view only) -->
        <div class="filter-container">
            <label>Filter by:</label>
            <select id="filterCategory">
                <option value="all">All Categories</option>
                <option value="personal">Personal</option>
                <option value="work">Work</option>
                <option value="shopping">Shopping</option>
                <option value="health">Health</option>
                <option value="other">Other</option>
            </select>
            <select id="filterStatus">
                <option value="all">All Status</option>
                <option value="active">Active</option>
                <option value="completed">Completed</option>
            </select>
        </div>
        
        <!-- Task list container (List view) -->
        <div class="task-list-container">
            <h2>Your Tasks</h2>
            <ul id="taskList"></ul>
        </div>

        <!-- Kanban Board (Board view) -->
        <div class="kanban-board" id="kanbanBoard" style="display:none">
            <div class="kanban-column" data-status="pending">
                <div class="kanban-column-header pending">
                    <h3><i class="fas fa-clock"></i> Pending</h3>
                </div>
                <div class="kanban-tasks" id="kanban-pending"></div>
            </div>
            <div class="kanban-column" data-status="in-progress">
                <div class="kanban-column-header in-progress">
                    <h3><i class="fas fa-spinner"></i> In Progress</h3>
                </div>
                <div class="kanban-tasks" id="kanban-in-progress"></div>
            </div>
            <div class="kanban-column" data-status="completed">
                <div class="kanban-column-header completed">
                    <h3><i class="fas fa-check-circle"></i> Completed</h3>
                </div>
                <div class="kanban-tasks" id="kanban-completed"></div>
            </div>
        </div>
        
        <!-- Task statistics -->
        <div class="task-stats">
            <p>Total Tasks: <span id="totalTasks">0</span></p>
            <p>Completed: <span id="completedTasks">0</span></p>
            <p>Pending: <span id="pendingTasks">0</span></p>
        </div>
        
        <!-- Clear buttons -->
        <div class="clear-buttons">
            <button id="clearCompleted">Clear Completed</button>
            <button id="clearAll">Clear All</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
